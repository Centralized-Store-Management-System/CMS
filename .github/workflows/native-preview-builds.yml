name: Native UI Preview Builds

on:
  push:
    branches:
      - feat/native-personal-business-control
    paths:
      - "mobile/**"
      - ".github/workflows/native-preview-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android installable debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-business-control-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator app (no Apple Developer signing)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mobile
        run: npm install
      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build for iOS Simulator without code signing
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -workspace *.xcworkspace > schemes.json
          SCHEME=$(python3 -c 'import json; d=json.load(open("schemes.json")); print(d["workspace"]["schemes"][0])')
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/mobile/BusinessControl-ios-simulator.zip"
      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: personal-business-control-ios-simulator
          path: mobile/BusinessControl-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
